<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register a card</title><link rel="stylesheet" href="tokens.css"></head>
<body><main class="page stack">

  <div class="row">
    <a class="btn btn--ghost btn--icon" href="home.html" aria-label="Back">&larr;</a>
    <div>
      <div class="label">Round 1 &middot; Best ball</div>
      <div style="font-size:16px;font-weight:600">Trinity Forest Golf Club</div>
    </div>
  </div>

  <h1 class="h1">Register your card</h1>

  <!-- S16 builds typed entry only. The photo arrives with S19. -->
  <form method="post" action="/rounds/1/cards/photo" enctype="multipart/form-data">
    <label class="card" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px;border-style:dashed;border-color:#3C4C3F;cursor:pointer">
      <span style="font-size:16px;font-weight:600">Photograph the scorecard</span>
      <span class="meta">The final card on the sim screen, all 18 holes in the frame</span>
      <input type="file" name="photo" accept="image/*" capture="environment" style="display:none">
    </label>
  </form>

  <a class="btn btn--ghost btn--block" href="submit-confirm.html">Type 18 scores instead</a>

  <p class="fine" style="margin:0;text-align:center">Both of you on one card? Both get registered.</p>
</main></body></html>
