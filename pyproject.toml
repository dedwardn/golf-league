[project]
name = "league"
version = "0.1.0"
description = "Async season engine for friend-group golf leagues"
requires-python = ">=3.12"
# Runtime dependencies are added by the build step that first needs them. See docs/BUILD_PLAN.md.
dependencies = [
    "alembic>=1.20.1",
    "pydantic>=2.10",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "vulture>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/league"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers --cov=league.domain --cov=league.store --cov-report=term-missing:skip-covered --cov-fail-under=95"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT",
    "C90",  # complexity
    "PL",   # pylint: argument, statement, branch and return budgets
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "T20",  # print statements
    "TID",  # import hygiene
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30
max-branches = 8
max-returns = 4

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
ignore_names = ["revision", "down_revision"]

[tool.importlinter]
root_package = "league"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: web > services > store | extract > domain"
type = "layers"
layers = [
    "league.web",
    "league.services",
    "league.store | league.extract",
    "league.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: standard library only"
type = "forbidden"
source_modules = ["league.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "pydantic", "jinja2", "httpx", "anthropic"]
